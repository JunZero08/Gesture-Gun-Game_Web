name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with PyInstaller
        run: |
          pyinstaller Gesture-Gun.spec --clean --noconfirm

      - name: Rename and package artifacts
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            mv dist/Gesture-Gun.exe dist/Gesture-Gun-Windows.exe
            echo "ARTIFACT_PATH=dist/Gesture-Gun-Windows.exe" >> $GITHUB_ENV
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            zip -r dist/Gesture-Gun-macOS.zip dist/Gesture-Gun.app
            echo "ARTIFACT_PATH=dist/Gesture-Gun-macOS.zip" >> $GITHUB_ENV
          else
            mv dist/Gesture-Gun dist/Gesture-Gun-Linux
            chmod +x dist/Gesture-Gun-Linux
            echo "ARTIFACT_PATH=dist/Gesture-Gun-Linux" >> $GITHUB_ENV
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: gesture-gun-${{ matrix.os }}
          path: ${{ env.ARTIFACT_PATH }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./releases

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Gesture-Gun ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Upload Windows executable
        uses: softprops/action-gh-release@v2
        with:
          files: ./releases/gesture-gun-windows-latest/Gesture-Gun-Windows.exe

      - name: Upload macOS zip
        uses: softprops/action-gh-release@v2
        with:
          files: ./releases/gesture-gun-macos-latest/Gesture-Gun-macOS.zip

      - name: Upload Linux executable
        uses: softprops/action-gh-release@v2
        with:
          files: ./releases/gesture-gun-ubuntu-latest/Gesture-Gun-Linux
